<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The MindSpark Academy</title>
<meta name="description" content="The MindSpark Academy: short, accurate lessons on science, space, history, money and how things work.">
<style>
  :root { --bg:#0e1228; --bg2:#22164a; --text:#f4f4f8; --dim:#a4a9c6; --accent:#5aa0ff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:linear-gradient(180deg,var(--bg),var(--bg2)); color:var(--text);
         display:flex; align-items:center; justify-content:center; padding:32px 16px; }
  main { max-width:640px; text-align:center; }
  h1 { font-size:clamp(2rem,6vw,3.2rem); margin:0 0 12px; letter-spacing:-0.02em; }
  p { color:var(--dim); font-size:1.1rem; line-height:1.6; margin:0 0 28px; }
  .btn { display:inline-block; background:var(--accent); color:#0e1228; font-weight:700;
         text-decoration:none; padding:14px 28px; border-radius:999px; }
  .topics { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:0 0 32px; padding:0; list-style:none; }
  .topics li { border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:6px 14px; font-size:.95rem; }
  footer { margin-top:48px; font-size:.9rem; color:var(--dim); }
  footer a { color:var(--dim); }
</style>
</head>
<body>
<main>
  <h1>The MindSpark Academy</h1>
  <p>A new lesson every day. Short, accurate and curious explanations of how the world works, for everyone.</p>
  <ul class="topics">
    <li>Science</li><li>Space</li><li>Human Body</li><li>History</li>
    <li>Money Basics</li><li>How Things Work</li><li>Planet Earth</li>
  </ul>
  <a class="btn" href="https://www.youtube.com/@TheMindSparkAcademy">Watch on YouTube</a>
  <footer>
    <a href="privacy.html">Privacy Policy</a>
  </footer>
</main>
</body>
</html>
